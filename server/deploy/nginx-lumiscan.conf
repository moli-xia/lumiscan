# LumiScan backend (managed by server/deploy/deploy.sh — not an aaPanel site).
#
# Clients that connect to the bare IP send no SNI, so this is the default server for :443 and
# serves the self-signed IP certificate. Sites with a domain (vps.555544.xyz…) are matched by SNI
# and are unaffected.
server {
    # Same listen options as the other :443 sites (nginx warns when they differ).
    listen 443 ssl http2 default_server;
    server_name 134.185.119.124;

    ssl_certificate     /opt/lumiscan/tls/server.crt;
    ssl_certificate_key /opt/lumiscan/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Room for a photo sent to 拍题解答 (base64 JPEG).
    client_max_body_size 8m;

    access_log /www/wwwlogs/lumiscan.log;
    error_log  /www/wwwlogs/lumiscan.error.log;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so clients can't spoof their IP for rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        # AI calls on long documents can take a while.
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
    }
}

# http://134.185.119.124/… → https
server {
    listen 80;
    server_name 134.185.119.124;
    return 301 https://$host$request_uri;
}
